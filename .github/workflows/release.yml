name: Release APK

# Push a tag like "v1.2.0" to build a signed release APK and publish it as a
# GitHub Release. The app's in-app updater (lib/services/update_service.dart)
# polls the "latest release" endpoint for this repo, so this workflow is
# what makes "make a change -> phone offers the update" actually happen.
on:
  push:
    tags:
      - "v*"
  # Lets a release be triggered from the GitHub API/UI on any branch, not
  # just by pushing a tag — useful when the environment building this repo
  # can't push git tags directly (e.g. a restricted CI credential).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true
        default: "0.1.0"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          fi
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set pubspec version to match tag
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version_name }}+${{ github.run_number }}/" pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get

      # Every release must be signed with the same key so Android will treat
      # it as an update rather than a conflicting package. The keystore is
      # generated once locally (see README) and stored base64-encoded as a
      # repo secret; it's decoded here only for the duration of the build.
      - name: Set up release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set. See README for one-time setup."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
