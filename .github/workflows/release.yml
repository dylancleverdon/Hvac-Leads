name: Release APK

# Push a tag like "v1.2.0" to build a signed release APK and publish it as a
# GitHub Release. The app's in-app updater (lib/services/update_service.dart)
# polls the "latest release" endpoint for this repo, so this workflow is
# what makes "make a change -> phone offers the update" actually happen.
on:
  push:
    tags:
      - "v*"
  # Lets a release be triggered from the GitHub API/UI on any branch, not
  # just by pushing a tag — useful when the environment building this repo
  # can't push git tags directly (e.g. a restricted CI credential).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true
        default: "0.1.0"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          fi
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set pubspec version to match tag
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version_name }}+${{ github.run_number }}/" pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get

      # Every release must be signed with the same key so Android will treat
      # it as an update rather than a conflicting package. The keystore is
      # generated once locally (see README) and stored base64-encoded as a
      # repo secret; it's decoded here only for the duration of the build.
      #
      # If that secret hasn't been set up yet, this falls back to generating
      # a one-off keystore right here in the runner (no secret needed at all)
      # so a downloadable, installable APK is never blocked on that setup
      # step. The tradeoff: a release built with the fallback key won't
      # install as a seamless *update* over a release built with a different
      # fallback key (Android requires matching signatures) — only real
      # consequence is you might need to uninstall the old one first. Once
      # the persistent keystore secret is added, every release after that
      # signs consistently and updates seamlessly.
      - name: Set up release signing
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "mode=persistent" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret set — signing with a one-off key generated for this run only. See README to switch to a persistent key so future releases update in place."
            echo "mode=fallback" >> "$GITHUB_OUTPUT"
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias ci-fallback -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci-fallback-pass -keypass ci-fallback-pass \
              -dname "CN=HVAC Leads CI, OU=CI, O=HVAC Leads, C=US"
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=ci-fallback-pass
          keyAlias=ci-fallback
          keyPassword=ci-fallback-pass
          EOF
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          append_body: true
          body: |
            ${{ steps.signing.outputs.mode == 'fallback' && '⚠️ Signed with a temporary, one-off key (no persistent RELEASE_KEYSTORE_BASE64 secret configured yet). Installable now; future releases may not update in place over this one until the persistent key is set up — see README.' || '' }}
          files: build/app/outputs/flutter-apk/app-release.apk
