name: hvac_leads
description: A personal CRM for tracking HVAC job applications near home.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Map + geo
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # Networking
  http: ^1.2.1

  # Local storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Links / sharing / files
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  open_filex: ^4.4.0

  # App/version info
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
