name: Release APK

# Push a tag like "v1.2.0" to build a signed release APK and publish it as a
# GitHub Release. The app's in-app updater (lib/services/update_service.dart)
# polls the "latest release" endpoint for this repo, so this workflow is
# what makes "make a change -> phone offers the update" actually happen.
on:
  push:
    tags:
      - "v*"
  # Lets a release be triggered from the GitHub API/UI on any branch, not
  # just by pushing a tag — useful when the environment building this repo
  # can't push git tags directly (e.g. a restricted CI credential).
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0"
        required: true
        default: "0.1.0"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          fi
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set pubspec version to match tag
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version_name }}+${{ github.run_number }}/" pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get

      # Every release must be signed with the same key so Android will treat
      # it as an update rather than a conflicting package. Rather than
      # requiring a human to run keytool locally and paste secrets into
      # GitHub, CI manages its own persistent key: the first run ever
      # generates it and commits it straight back into the repo; every run
      # after that just finds it already there and reuses it. Nothing here
      # ever leaves the runner except via this job's own git push.
      - name: Set up release signing
        run: |
          KEYSTORE_PATH="android/app/ci-release.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "::error::No committed keystore yet, and this run isn't on a branch (it's a tag push) so I can't commit one back. Run this workflow once via 'Run workflow' on a branch first to seed the keystore, then tag pushes will find it."
              exit 1
            fi
            echo "No committed keystore found — generating one for the first time."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias hvacleads -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass hvacleads2026 -keypass hvacleads2026 \
              -dname "CN=HVAC Leads, OU=Personal, O=HVAC Leads, C=US"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$KEYSTORE_PATH"
            git commit -m "Add persistent CI release-signing keystore [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          cat > android/key.properties <<EOF
          storeFile=ci-release.keystore
          storePassword=hvacleads2026
          keyAlias=hvacleads
          keyPassword=hvacleads2026
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
